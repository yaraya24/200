<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="signin-section" class="section">
            <h2>Sign In</h2>
            <form id="signin-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <div id="dashboard-section" class="section hidden">
            <h2>Welcome!</h2>
            <p>You are successfully signed in.</p>
            <div class="user-info">
                <p>Logged in as: <span id="current-user"></span></p>
                <p>Session started: <span id="session-time"></span></p>
            </div>
            <button id="signout-btn" class="signout-button">Sign Out</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
